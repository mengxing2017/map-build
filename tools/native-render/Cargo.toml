[package]
name = "huavd-native-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

# setup-native-renderer.sh stages this crate beside the fixed wrapper checkout.
[dependencies]
maplibre_native = { path = "../wrapper", features = ["vulkan"] }
clap = { version = "4.5.27", features = ["derive"] }
serde_json = "1.0"
url = "2.5.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace]
