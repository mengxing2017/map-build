schema_version: 1
description: "source-layer to OSM tags-filter and osmium export field policy."

global:
  name_coalesce_order:
    - "name:zh-Hans"
    - "name:zh"
    - "name"
    - "name:en"
  per_region_name_overrides: {}
  reject_unknown_fields_after_normalize: true
  osmium_attributes:
    type: false
    id: false
    version: false
    changeset: false
    timestamp: false
    uid: false
    user: false

source_layers:
  road:
    order: 1
    geometry: "line"
    osm_tags:
      - "highway=*"
    geofabrik_shapefile: "gis_osm_roads_free_1.shp"
    tags_filter:
      - "w/highway"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "ref"
      - "highway"
      - "oneway"
      - "maxspeed"
      - "layer"
      - "bridge"
      - "tunnel"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      ref: "String"
      highway: "String"
      oneway: "Boolean"
      maxspeed: "Number"
      layer: "Number"
      bridge: "Boolean"
      tunnel: "Boolean"
    renderer: "MapLibre"

  railway:
    order: 2
    geometry: "line"
    osm_tags:
      - "railway=*"
    geofabrik_shapefile: "gis_osm_railways_free_1.shp"
    tags_filter:
      - "w/railway"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "railway"
      - "highspeed"
      - "layer"
      - "bridge"
      - "tunnel"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      railway: "String"
      highspeed: "Boolean"
      layer: "Number"
      bridge: "Boolean"
      tunnel: "Boolean"
    renderer: "MapLibre"

  water:
    order: 3
    geometry: "polygon"
    osm_tags:
      - "natural=water"
    geofabrik_shapefile: "gis_osm_water_a_free_1.shp"
    tags_filter:
      - "a/natural=water"
    post_filter:
      exclude:
        place:
          - "island"
          - "islet"
      geometry:
        - "Polygon"
        - "MultiPolygon"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "width"
      - "water"
      - "intermittent"
      - "seasonal"
      - "place"
      - "natural"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      width: "Number"
      water: "String"
      intermittent: "String"
      seasonal: "String"
      place: "String"
    renderer: "MapLibre"

  waterway:
    order: 4
    geometry: "line"
    osm_tags:
      - "waterway=*"
    geofabrik_shapefile: "gis_osm_waterways_free_1.shp"
    tags_filter:
      - "w/waterway"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "waterway"
      - "width"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      waterway: "String"
      width: "Number"
    renderer: "MapLibre"

  landuse:
    order: 5
    geometry: "polygon"
    osm_tags:
      - "landuse=*"
    geofabrik_shapefile: "gis_osm_landuse_a_free_1.shp"
    tags_filter:
      - "a/landuse"
    post_filter:
      geometry:
        - "Polygon"
        - "MultiPolygon"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "landuse"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      landuse: "String"
    renderer: "MapLibre"

  building:
    order: 6
    geometry: "polygon"
    osm_tags:
      - "building=*"
    geofabrik_shapefile: "gis_osm_buildings_a_free_1.shp"
    tags_filter:
      - "a/building"
    post_filter:
      geometry:
        - "Polygon"
        - "MultiPolygon"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "type"
      - "building"
      - "height"
      - "min_height"
      - "building:levels"
      - "levels"
      - "roof:height"
      - "roof_height"
    normalize:
      type_from: "building"
      levels_from: "building:levels"
      roof_height_from: "roof:height"
      height_derivation: "height first, else building:levels * 3 + 1 meters for building-vector only"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      type: "String"
      building: "String"
      height: "Number"
      min_height: "Number"
      levels: "Number"
      roof_height: "Number"
    renderer: "MapLibre fill-extrusion"

  admin:
    order: 7
    geometry: "polygon"
    osm_tags:
      - "boundary=administrative"
    geofabrik_shapefile: "gis_osm_adminareas_a_free_1.shp"
    tags_filter:
      - "r/boundary=administrative"
      - "a/boundary=administrative"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
    renderer: "MapLibre"

  admin_line:
    order: 17
    geometry: "line"
    osm_tags:
      - "boundary=administrative"
    geofabrik_shapefile: "gis_osm_borders_arcs_free_1.shp"
    tags_filter:
      - "r/boundary=administrative"
    post_filter:
      geometry:
        - "LineString"
        - "MultiLineString"
    # Relation member ways may have no tags of their own; retain them for the
    # relation-level join performed by admin-line-tier.sh.
    export_keep_untagged: true
    enrich_fields:
      # @id comes from osmium's enabled id attribute; the tier step consumes
      # and removes it, while the remaining fields are derived by that step.
      - "@id"
      - "admin_tier"
      - "level_source"
    include_tags:
      - "admin_level"
      - "boundary"
      - "maritime"
      - "disputed"
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
    final_fields:
      admin_level: "Number"
      admin_tier: "String"
      level_source: "String"
      maritime: "String"
      disputed: "String"
      "@id": "Number"
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
    renderer: "MapLibre"

  natural_a:
    order: 8
    geometry: "polygon"
    osm_tags:
      - "natural=*"
      - "natural!=water"
    geofabrik_shapefile: "gis_osm_natural_a_free_1.shp"
    tags_filter:
      - "a/natural"
    post_filter:
      exclude:
        natural:
          - "water"
      geometry:
        - "Polygon"
        - "MultiPolygon"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "natural"
      - "place"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      natural: "String"
      place: "String"
    renderer: "MapLibre"

  natural_line:
    order: 9
    geometry: "line"
    osm_tags:
      - "natural=cliff"
      - "natural=tree_row"
    geofabrik_shapefile: null
    tags_filter:
      - "w/natural=cliff"
      - "w/natural=tree_row"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "natural"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      natural: "String"
    renderer: "MapLibre"

  peak:
    order: 10
    geometry: "point"
    osm_tags:
      - "natural=peak"
    geofabrik_shapefile: null
    tags_filter:
      - "n/natural=peak"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "natural"
      - "ele"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      natural: "String"
      ele: "Number"
    renderer: "MapLibre symbol"

  leisure_a:
    order: 11
    geometry: "polygon"
    osm_tags:
      - "leisure=*"
    geofabrik_shapefile: null
    tags_filter:
      - "a/leisure"
    post_filter:
      geometry:
        - "Polygon"
        - "MultiPolygon"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "leisure"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      leisure: "String"
    renderer: "MapLibre"

  place_label:
    order: 12
    geometry: "point"
    osm_tags:
      - "place=*"
    geofabrik_shapefile: "gis_osm_places_free_1.shp"
    tags_filter:
      - "n/place"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "place"
      - "population"
      - "official_name"
    enrich_fields:
      - "admin_id"
      - "boundary_admin_level"
      - "label_tier"
      - "label_rank"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      official_name: "String"
      population: "Number"
      admin_id: "Number"
      boundary_admin_level: "Number"
      label_tier: "String"
      label_rank: "Number"
      place: "String"
    renderer: "MapLibre symbol"

  poi_label:
    order: 13
    geometry: "point"
    osm_tags:
      - "amenity=*"
      - "amenity=hospital"
      - "amenity=clinic"
      - "amenity=doctors"
      - "amenity=school"
      - "amenity=university"
      - "amenity=college"
      - "amenity=kindergarten"
      - "shop=*"
      - "tourism=*"
    geofabrik_shapefile: "gis_osm_pois_free_1.shp"
    tags_filter:
      - "n/amenity"
      - "a/amenity=hospital"
      - "a/amenity=clinic"
      - "a/amenity=doctors"
      - "a/amenity=school"
      - "a/amenity=university"
      - "a/amenity=college"
      - "a/amenity=kindergarten"
      - "n/shop"
      - "n/tourism"
      - "w/tourism"
      - "a/tourism"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "amenity"
      - "shop"
      - "tourism"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      amenity: "String"
      shop: "String"
      tourism: "String"
    renderer: "MapLibre symbol"

  transport_label:
    order: 14
    geometry: "point"
    osm_tags:
      - "public_transport=*"
      - "railway=station"
      - "railway=halt"
      - "railway=tram_stop"
      - "railway=subway_entrance"
      - "railway=stop"
    geofabrik_shapefile: "gis_osm_transport_free_1.shp"
    tags_filter:
      - "n/public_transport"
      - "n/railway=station"
      - "n/railway=halt"
      - "n/railway=tram_stop"
      - "n/railway=subway_entrance"
      - "n/railway=stop"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "public_transport"
      - "railway"
      - "ref"
      - "network"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      public_transport: "String"
      railway: "String"
      ref: "String"
      network: "String"
    renderer: "MapLibre symbol"

  highway_point:
    order: 15
    geometry: "point"
    osm_tags:
      - "highway=bus_stop"
      - "highway=services"
      - "highway=rest_area"
    geofabrik_shapefile: null
    tags_filter:
      - "n/highway=bus_stop"
      - "n/highway=services"
      - "n/highway=rest_area"
      - "w/highway=services"
      - "w/highway=rest_area"
      - "a/highway=services"
      - "a/highway=rest_area"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "highway"
      - "ref"
      - "network"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      highway: "String"
      ref: "String"
      network: "String"
    renderer: "MapLibre symbol"

  island:
    order: 16
    geometry: "polygon"
    osm_tags:
      - "place=island"
      - "place=islet"
    geofabrik_shapefile: null
    tags_filter:
      - "a/place=island"
      - "a/place=islet"
      - "n/place=island"
      - "n/place=islet"
    post_filter:
      geometry:
        - "Polygon"
        - "MultiPolygon"
        - "Point"
    include_tags:
      - "name"
      - "name:zh-Hans"
      - "name:zh"
      - "name:en"
      - "name:ja"
      - "name:ko"
      - "place"
      - "natural"
    enrich_fields:
      - "in_water"
      - "island_anchor"
      - "island_area_km2"
    final_fields:
      name: "String"
      "name:zh-Hans": "String"
      "name:zh": "String"
      "name:en": "String"
      "name:ja": "String"
      "name:ko": "String"
      place: "String"
      natural: "String"
      in_water: "Boolean"
      island_anchor: "Boolean"
      island_area_km2: "Number"
    renderer: "MapLibre"
