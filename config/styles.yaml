schema_version: 1
source:
  id: "huavd-offline"
  type: "vector"
  url: "pmtiles://{pmtiles}"
glyphs_url: "huavd-map://glyphs/{locale}/{fontstack}/{range}.pbf"
sprite: null

locales:
  - tag: "zh-Hans"
    name_fields: ["name:zh-Hans", "name:zh", "name", "name:en"]
    font_stack: ["NotoSansCJKsc-Regular"]
  - tag: "en"
    name_fields: ["name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSans-Regular"]
  - tag: "ja"
    name_fields: ["name:ja", "name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSansCJKjp-Regular"]
  - tag: "ko"
    name_fields: ["name:ko", "name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSansCJKkr-Regular"]

text_layers:
  - id: "place-label"
    source_layer: "place_label"
    minzoom: 2
    font_stack: ["NotoSans-Regular"]
    text_size: 12
  - id: "poi-label"
    source_layer: "poi_label"
    minzoom: 14
    font_stack: ["NotoSans-Regular"]
    text_size: 11
  - id: "transport-label"
    source_layer: "transport_label"
    minzoom: 13
    font_stack: ["NotoSans-Regular"]
    text_size: 11
  - id: "road-labels"
    source_layer: "road"
    minzoom: 12
    font_stack: ["NotoSans-Regular"]
    text_size: 11
    placement: "line"
    symbol_spacing: 240
    text_optional: true
  - id: "building-labels"
    source_layer: "building"
    minzoom: 15
    font_stack: ["NotoSans-Regular"]
    text_size: 10
    text_optional: true
  - id: "waterway-labels"
    source_layer: "waterway"
    minzoom: 12
    font_stack: ["NotoSans-Regular"]
    text_size: 11
    placement: "line"
    symbol_spacing: 600
    text_optional: true
  - id: "water-labels"
    source_layer: "water"
    minzoom: 10
    font_stack: ["NotoSans-Regular"]
    text_size: 12
    text_optional: true
