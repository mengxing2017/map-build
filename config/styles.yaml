schema_version: 1
source:
  id: "huavd-offline"
  type: "vector"
  url: "pmtiles://{pmtiles}"
raster_source:
  id: "raster-bake"
  type: "raster"
  url: "pmtiles://{raster_pmtiles}"
  tile_size: 256
raster_overlays:
  bake_layer_types: ["background", "fill", "line"]
  vector_overlay_layer_types: ["symbol"]
  exclude_bake_layer_types: ["symbol", "fill-extrusion"]
glyphs_url: "huavd-map://glyphs/{locale}/{fontstack}/{range}.pbf"
sprite: "huavd-map://sprite/sprite"

locales:
  - tag: "zh-Hans"
    name_fields: ["name:zh-Hans", "name:zh", "name", "name:en"]
    font_stack: ["NotoSansCJKsc-Regular"]
  - tag: "en"
    name_fields: ["name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSans-Regular"]
  - tag: "ja"
    name_fields: ["name:ja", "name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSansCJKjp-Regular"]
  - tag: "ko"
    name_fields: ["name:ko", "name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSansCJKkr-Regular"]

background_color: "#eef2f3"

text_layers:
  - id: "peak-symbol"
    source_layer: "peak"
    minzoom: 10
    layout:
      icon-image: "peak"
      icon-size: 0.85
      icon-allow-overlap: false
      text-size: ["interpolate",["linear"],["zoom"],10,10,15,12]
      text-offset: [0,0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "transport-station-symbol"
    source_layer: "transport_label"
    minzoom: 12
    filter: ["match",["get","railway"],["station","halt","subway_entrance","tram_stop"],true,false]
    layout:
      icon-image: ["match",["get","railway"],"subway_entrance","rail-metro","tram_stop","rail-light","rail"]
      icon-size: 0.8
      icon-allow-overlap: true
      icon-ignore-placement: true
      text-size: ["interpolate",["linear"],["zoom"],12,10,15,12]
      text-offset: [0,0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#374151"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "highway-point-symbol"
    source_layer: "highway_point"
    minzoom: 12
    filter: ["match",["get","highway"],["bus_stop","services","rest_area"],true,false]
    name_prefix_fields: ["ref"]
    layout:
      icon-image: ["match",["get","highway"],"bus_stop","bus","services","services","rest_area","rest-area","services"]
      icon-size: 0.8
      icon-allow-overlap: true
      icon-ignore-placement: true
      text-size: ["interpolate",["linear"],["zoom"],12,10,15,12]
      text-offset: [0,0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "poi-amenity-symbol"
    source_layer: "poi_label"
    minzoom: 13
    filter: ["match",["get","amenity"],["hospital","clinic","doctors","school","university","college","kindergarten"],true,false]
    layout:
      icon-image: ["match",["get","amenity"],"hospital","hospital","clinic","hospital","doctors","hospital","school","school","university","school","college","school","kindergarten","school","school"]
      icon-size: 0.78
      icon-allow-overlap: true
      icon-ignore-placement: true
      text-size: ["interpolate",["linear"],["zoom"],13,10,16,12]
      text-offset: [0,0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: ["match",["get","amenity"],"hospital","#b91c1c","clinic","#b91c1c","doctors","#b91c1c","#334155"]
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "poi-tourism-symbol"
    source_layer: "poi_label"
    minzoom: 14
    filter: ["match",["get","tourism"],["museum","attraction","viewpoint","hotel"],true,false]
    layout:
      icon-image: ["match",["get","tourism"],"museum","museum","viewpoint","viewpoint","hotel","lodging","attraction","attraction","attraction"]
      icon-size: 0.75
      icon-allow-overlap: false
      text-size: ["interpolate",["linear"],["zoom"],14,10,17,12]
      text-offset: [0,0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "poi_label-labels"
    source_layer: "poi_label"
    minzoom: 14
    layout:
      text-size: ["interpolate",["linear"],["zoom"],14,10,17,12]
      text-offset: [0,0.5]
      text-anchor: "top"
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "road-shield"
    source_layer: "road"
    minzoom: 8
    filter: ["all",["has","ref"],["!=",["get","ref"],""],["match",["get","highway"],["motorway","trunk","primary","secondary"],true,false]]
    layout:
      text-field: ["get","ref"]
      text-size: ["interpolate",["linear"],["zoom"],8,10,12,11,16,13]
      symbol-placement: "line"
      symbol-spacing: ["interpolate",["linear"],["zoom"],8,360,12,520,16,680]
      text-allow-overlap: false
      text-ignore-placement: false
      text-optional: true
    paint:
      text-color: "#263238"
      text-halo-color: "#ffffff"
      text-halo-width: 1.6
  - id: "road-labels"
    source_layer: "road"
    minzoom: 12
    layout:
      symbol-placement: "line"
      text-size: ["interpolate",["linear"],["zoom"],12,10,16,12]
      symbol-spacing: ["interpolate",["linear"],["zoom"],12,220,16,320]
      text-rotation-alignment: "map"
      text-pitch-alignment: "viewport"
      text-optional: true
    paint:
      text-color: "#6b5f4f"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "railway-labels"
    source_layer: "railway"
    minzoom: 11
    filter: ["match",["get","railway"],["rail","subway","light_rail","tram"],true,false]
    layout:
      symbol-placement: "line"
      text-size: ["interpolate",["linear"],["zoom"],11,10,14,12]
      symbol-spacing: 480
      text-rotation-alignment: "map"
      text-pitch-alignment: "viewport"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "waterway-labels"
    source_layer: "waterway"
    minzoom: 12
    layout:
      symbol-placement: "line"
      text-size: ["interpolate",["linear"],["zoom"],12,10,16,12]
      symbol-spacing: ["interpolate",["linear"],["zoom"],12,220,16,320]
      text-rotation-alignment: "map"
      text-pitch-alignment: "viewport"
      text-optional: true
    paint:
      text-color: "#6b5f4f"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "water-labels"
    source_layer: "water"
    minzoom: 10
    layout:
      text-size: ["interpolate",["linear"],["zoom"],10,10,15,13]
      text-anchor: "center"
    paint:
      text-color: "#397aa3"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "island-anchor-labels-large"
    source_layer: "island"
    minzoom: 4
    filter: ["all",["==",["geometry-type"],"Point"],[">=",["get","island_area_km2"],1000]]
    layout:
      text-size: ["interpolate",["linear"],["zoom"],4,14,8,18]
      text-anchor: "center"
      text-allow-overlap: false
