schema_version: 1
source:
  id: "huavd-offline"
  type: "vector"
  url: "pmtiles://{pmtiles}"
glyphs_url: "huavd-map://glyphs/{locale}/{fontstack}/{range}.pbf"
sprite: "huavd-map://sprite/sprite"

locales:
  - tag: "zh-Hans"
    name_fields: ["name:zh-Hans", "name:zh", "name", "name:en"]
    font_stack: ["NotoSansCJKsc-Regular"]
  - tag: "en"
    name_fields: ["name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSans-Regular"]
  - tag: "ja"
    name_fields: ["name:ja", "name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSansCJKjp-Regular"]
  - tag: "ko"
    name_fields: ["name:ko", "name:en", "name:zh-Hans", "name"]
    font_stack: ["NotoSansCJKkr-Regular"]

text_layers:
  - id: "place-label"
    source_layer: "place_label"
    minzoom: 2
    font_stack: ["NotoSans-Regular"]
    text_size: 12
  - id: "poi-label"
    source_layer: "poi_label"
    minzoom: 14
    font_stack: ["NotoSans-Regular"]
    text_size: 11
  - id: "transport-label"
    source_layer: "transport_label"
    minzoom: 13
    font_stack: ["NotoSans-Regular"]
    text_size: 11
  - id: "road-labels"
    source_layer: "road"
    minzoom: 12
    font_stack: ["NotoSans-Regular"]
    text_size: 11
    placement: "line"
    symbol_spacing: 240
    text_optional: true
  - id: "railway-labels"
    source_layer: "railway"
    minzoom: 11
    font_stack: ["NotoSans-Regular"]
    text_size: 10
    placement: "line"
    symbol_spacing: 480
    text_optional: true
  - id: "building-labels"
    source_layer: "building"
    minzoom: 15
    font_stack: ["NotoSans-Regular"]
    text_size: 10
    text_optional: true
  - id: "waterway-labels"
    source_layer: "waterway"
    minzoom: 12
    font_stack: ["NotoSans-Regular"]
    text_size: 11
    placement: "line"
    symbol_spacing: 600
    text_optional: true
  - id: "water-labels"
    source_layer: "water"
    minzoom: 10
    font_stack: ["NotoSans-Regular"]
    text_size: 12
    text_optional: true
  - id: "island-labels"
    source_layer: "island"
    minzoom: 8
    font_stack: ["NotoSans-Regular"]
    text_size: 11
    text_optional: true

paint_layers:
  - id: "peak-symbol"
    source_layer: "peak"
    type: "symbol"
    minzoom: 10
    layout:
      icon-image: "peak"
      icon-size: 0.85
      icon-allow-overlap: false
      text-field: ["coalesce", ["get", "name"], ["get", "name:en"]]
      text-font: ["NotoSans-Regular"]
      text-size: 10
      text-offset: [0, 0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "transport-station-symbol"
    source_layer: "transport_label"
    type: "symbol"
    minzoom: 12
    filter: ["match", ["get", "railway"], ["station", "halt", "tram_stop", "subway_entrance", "stop"], true, false]
    layout:
      icon-image:
        match:
          field: "railway"
          cases:
            "subway_entrance": "rail-metro"
            "tram_stop": "rail-light"
          default: "rail"
      icon-size: 0.8
      icon-allow-overlap: false
      text-field: ["coalesce", ["get", "name"], ["get", "ref"]]
      text-font: ["NotoSans-Regular"]
      text-size: 10
      text-offset: [0, 0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#374151"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "highway-point-symbol"
    source_layer: "highway_point"
    type: "symbol"
    minzoom: 12
    layout:
      icon-image:
        match:
          field: "highway"
          cases:
            "motorway_junction": "road-junction"
            "bus_stop": "bus"
          default: "road-junction"
      icon-size: 0.8
      icon-allow-overlap: false
      text-field: ["coalesce", ["get", "ref"], ["get", "name"]]
      text-font: ["NotoSans-Regular"]
      text-size: 10
      text-offset: [0, 0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "poi-tourism-symbol"
    source_layer: "poi_label"
    type: "symbol"
    minzoom: 14
    filter: ["match", ["get", "tourism"], ["museum", "attraction", "viewpoint", "hotel", "information"], true, false]
    layout:
      icon-image:
        match:
          field: "tourism"
          cases:
            "museum": "museum"
            "attraction": "attraction"
            "viewpoint": "viewpoint"
            "hotel": "lodging"
          default: "attraction"
      icon-size: 0.75
      icon-allow-overlap: false
      text-field: ["coalesce", ["get", "name"], ["get", "name:en"]]
      text-font: ["NotoSans-Regular"]
      text-size: 10
      text-offset: [0, 0.8]
      text-anchor: "top"
      text-optional: true
    paint:
      text-color: "#4b5563"
      text-halo-color: "#ffffff"
      text-halo-width: 1
  - id: "water"
    source_layer: "water"
    type: "fill"
    minzoom: 0
    paint:
      fill-color: "#aad3df"
      fill-opacity: 0.85
  - id: "island"
    source_layer: "island"
    type: "fill"
    minzoom: 0
    paint:
      fill-color: "#f2efe9"
      fill-opacity: 1
  - id: "railway"
    source_layer: "railway"
    type: "line"
    minzoom: 8
    layout:
      line-cap: "round"
      line-join: "round"
    paint:
      line-color:
        match:
          field: "railway"
          cases:
            "rail":
              - "case"
              - ["==", ["get", "highspeed"], "yes"]
              - "#e03e3e"
              - "#787878"
            "subway": "#5b3e3e"
            "tram": "#a85e1a"
            "light_rail": "#a85e1a"
            "narrow_gauge": "#787878"
            "abandoned": "transparent"
            "disused": "transparent"
          default: "#787878"
      line-width:
        match:
          field: "railway"
          cases:
            "rail": 1.2
            "subway": 1
            "tram": 0.8
            "light_rail": 0.8
            "narrow_gauge": 0.8
            "abandoned": 0.5
            "disused": 0.5
          default: 1
      line-dasharray:
        match:
          field: "railway"
          cases:
            "subway": [2, 2]
            "narrow_gauge": [3, 3]
            "abandoned": [1, 2]
            "disused": [1, 2]
          default: [1, 0]
      line-opacity:
        match:
          field: "tunnel"
          cases:
            "yes": 0.5
          default: 1
