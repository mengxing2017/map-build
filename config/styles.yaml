    layout:
      text-size: ["interpolate",["linear"],["zoom"],8,10,13,12]
      text-anchor: "center"
      text-optional: true
    paint:
      text-color: "#374151"
      text-halo-color: "#ffffff"
      text-halo-width: 1.2
  - id: "building-labels"
    source_layer: "building"
