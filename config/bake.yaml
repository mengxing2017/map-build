schema_version: 1
description: "Raster bake defaults for non-label OSM base map rendering."

defaults:
  raster_bake:
    tile_size: 256
    min_zoom: 0
    max_zoom: 14
    pixel_ratio: 1
    parallel_jobs: 8
    bbox_padding_tiles: 1
    skip_existing: true
    png_cache_retention: 0
    encoding: "webp"
    cwebp:
      lossless: true
      method: 6
      metadata: "none"

high_density:
  - region_match: "japan/tokyo*"
    parallel_jobs: 16
    max_zoom: 14
  - region_match: "china/shanghai"
    parallel_jobs: 16
    max_zoom: 14
  - region_match: "china/guangdong/shenzhen"
    parallel_jobs: 16
    max_zoom: 14
  - region_match: "china/hong-kong"
    parallel_jobs: 16
    max_zoom: 14
